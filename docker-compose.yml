services:

  mysql:
    container_name: mysql
    image: mysql:8.0
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  node-app:
    container_name: node-app
    build: .
    env_file:
      - .env
    volumes:
      - ./files:/app/files
    depends_on:
      - mysql
    expose:
      - "3000"
    restart: always

  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./files:/app/files
    depends_on:
      - node-app
    restart: always

volumes:
  mysql_data:
