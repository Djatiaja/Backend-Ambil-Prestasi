stages:
  - install
  - test
  - build
  - deploy

variables:
  NODE_ENV: production
  NODE_VERSION: "20"

install_dependencies:
  image: node:${NODE_VERSION}-alpine
  stage: install
  script:
    - npm ci
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

run_tests:
  image: node:${NODE_VERSION}-alpine
  stage: test
  
  script:
    - npm ci
    - npm run test
  only:
    - merge_requests
    - main

build_project:
  image: node:${NODE_VERSION}-alpine
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

